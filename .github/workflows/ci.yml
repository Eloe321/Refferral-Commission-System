name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U sandbox -d referral_sandbox; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Migrate the disposable test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://sandbox:sandbox@localhost:5432/referral_sandbox
      - run: pnpm test:integration
      - run: pnpm test:api-e2e
      - run: pnpm privacy:check
      - name: PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload browser report, screenshots, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color api web postgres mailpit

  images:
    name: Build production images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file apps/api/Dockerfile --tag referral-sandbox-api:ci .
      - run: docker build --file apps/web/Dockerfile --tag referral-sandbox-web:ci .
